name: Monthly Parameter Tuning

on:
  schedule:
    # 1st of month 8:00 AM UK = 07:00 UTC (winter) / 08:00 UTC (summer)
    - cron: '0 7 1 * *'  # 1st of month 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monthly-tune:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download ChartScanAI weights
        run: |
          mkdir -p weights
          curl -L -o weights/custom_yolov8.pt \
            https://github.com/Omar-Karimov/ChartScanAI/raw/main/weights/custom_yolov8.pt

      - name: Update fundamentals cache
        run: |
          python scripts/update_fundamentals.py --force

      - name: Run monthly grid search
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_monthly_tune.py

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/params.yaml
          if ! git diff --staged --quiet; then
            git commit -m "Monthly update: params + fundamentals ${{ github.run_id }}"
            git push
          else
            echo "No changes"
          fi